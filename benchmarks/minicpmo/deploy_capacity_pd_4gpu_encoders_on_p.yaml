# MiniCPM-o 4.5 native-duplex P/D placement comparison.
# GPU 0: Vision Encoder + Audio Encoder + Thinker-P
# GPU 1: Thinker-D
# GPU 2: Talker
# GPU 3: Code2Wav
#
# The arrival-preencode protocol, per-session encoder state, P/D handoff,
# context policy, fixed KV budgets and sampling settings are inherited.
# Explicit cuda:0 preserves the same asynchronous sidecar path on the P GPU.
base_config: deploy_capacity_pd_4gpu.yaml
pipeline: minicpmo_4_5_pd
session_mode: duplex
active_stream_window: 0

duplex_session:
  idle_ttl_s: 300
  disconnect_grace_s: 30
  reaper_interval_s: 5
  resume_replay_ttl_s: 60
  resume_replay_max_bytes_per_session: 8388608
  max_pending_input_bytes_per_session: 16777216
  max_pending_turns_per_session: 4
  max_sessions: 64
  completed_append_cache_size: 256

stages:
  - stage_id: 0
    env:
      VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
      VLLM_OMNI_AUX_VISIBLE_DEVICES: ""
      MINICPMO45_VISION_ENCODER_DEVICE: "cuda:0"
      MINICPMO45_VISION_ENCODER_BATCH_SIZE: "16"
      MINICPMO45_AUDIO_ENCODER_DEVICE: "cuda:0"
      MINICPMO45_AUDIO_ENCODER_BATCH_SIZE: "16"
      MINICPMO45_MAX_ARRIVAL_VISION_CACHE_ENTRIES: "0"
      MINICPMO45_MAX_ARRIVAL_AUDIO_CACHE_ENTRIES: "0"

  - stage_id: 2
    devices: "2"

  - stage_id: 3
    devices: "3"
