# Canonical Qwen3-Omni-MoE deployment for continuous-AV capacity tests.
# Thinker, talker, and code2wav run as separate processes on GPUs 0, 1, and 2.
# Keep this file fixed across session-policy comparisons.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      # A ~0.56 s playable first granule clears the 500 ms client prebuffer;
      # 4-frame steady chunks then arrive faster than their ~0.32 s duration.
      initial_codec_chunk_frames: 8
      codec_chunk_frames: 4
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    # Final responses use priority 0; silent arrival warm-ups use priority 10.
    scheduling_policy: priority
    gpu_memory_utilization: 0.9
    # Full-history finite requests reuse processed media by UUID. Keep the
    # bounded eight-user working set in the API-side processor cache; the
    # canonical launcher disables the unsafe mirrored EngineCore LRU.
    mm_processor_cache_gb: 16
    trust_remote_code: true
    quantization: fp8
    kv_cache_dtype: fp8
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    trust_remote_code: true
    quantization: fp8
    kv_cache_dtype: fp8
    # Finite response requests carry a session-isolated, token-exact Talker
    # conditioning lineage; reuse only complete historical user-prefix blocks.
    enable_prefix_caching: true
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 65536
    max_num_seqs: 64
    gpu_memory_utilization: 0.6
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1
