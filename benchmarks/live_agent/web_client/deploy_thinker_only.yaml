# THINKER-ONLY boot: stage 0 alone, no talker, no vocoder. Exists for the
# duplex-brain measurement (2026-08-09): 128 users x paced real-speech
# ingestion + text-only turns, thinker TTFT p99 -- with the talker absent at
# the ENGINE level, nothing can splash downstream (the per-append junk
# boundary has no stage 1 to ship to), and the whole card belongs to the
# brain. Sessions must use modalities ["text"]; audio INPUT still works (the
# thinker hears), only speech OUTPUT does not exist.
# Shares are unchanged from the default (0.72) on purpose: same pool, same
# max_model_len, so thinker-side numbers compare directly with 3-stage runs.

async_chunk: true

stages:
  - stage_id: 0                      # thinker: vision + audio encoders + LLM
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    gpu_memory_utilization: 0.72
    quantization: fp8
    kv_cache_dtype: fp8
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
