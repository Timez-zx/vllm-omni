# On-the-fly FP8: OFFICIAL bf16 checkpoint, vLLM quantizes the thinker at
# load time (quantization: fp8 on stage 0 ONLY; talker and code2wav stay
# bf16). Exists because the community block-FP8 checkpoint produced
# degenerate text (verbatim loops) on this fork -- isolated to the weights
# path with bf16 KV on 2026-08-02. KV stays bf16 here; flip kv_cache_dtype
# in a second step only after this passes the text gate.
#
# Meant to be used with the block-FP8 weights checkpoint:
#   QWEN_MODEL=marksverdhei/Qwen3-Omni-30B-A3B-FP8 \
#   DEPLOY_CONFIG=.../deploy_web_fp8.yaml bash run_qwen_server.sh
#
# Measured on boot (2026-08-02): FP8 weights alone take the thinker from
# 59.4 -> 31.7 GiB and the stage-0 KV pool from 106,880 -> 404,736 tokens at
# bf16 KV (96 KB/token). fp8 KV halves the per-token cost, so the same
# 37 GiB pool should land around ~810k tokens -- read the boot log line
# "GPU KV cache size" for the real number, never trust the estimate.
#
# Stage 1 (talker) KV stays bf16 ON PURPOSE: the talker feeds the vocoder
# directly and is the quality-sensitive stage; its own pool (265,888 tokens
# at FP8 weights) is nowhere near binding anyway. One variable at a time.
#
# Everything else is identical to deploy_web_demo.yaml -- see that file for
# the reasoning behind each value.

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25

stages:
  - stage_id: 0                      # thinker: vision + audio encoders + LLM
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    gpu_memory_utilization: 0.74
    quantization: fp8
    kv_cache_dtype: fp8
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1                      # talker: speech codec token LM
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    gpu_memory_utilization: 0.10
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    enforce_eager: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2                      # code2wav: waveform reconstruction
    max_num_batched_tokens: 65536
    max_num_seqs: 4
    gpu_memory_utilization: 0.08
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
