# LADDER VARIANT of deploy_mu_sw4k_kvfp8.yaml: shares back to 0.67/0.15/0.08
# so the TALKER POOL CANNOT be the binder in the 128-user burst ladder.
# At 0.15 with FP8 KV the pool is ~7.5 GiB = ~785k tokens = 6.1k/user at 128
# users -- above even the uncapped 30-turn accumulation (5.4k), ~30% margin
# over the 4k-window steady state. Whatever bursts at 128 users on this
# config is compute/scheduling, not pool exhaustion. The serving default
# stays deploy_mu_sw4k_kvfp8.yaml (0.72/0.10/0.08).

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25
  connector_coloc_speech:
    name: ColocInProcConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25

stages:
  - stage_id: 0                      # thinker: vision + audio encoders + LLM
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    gpu_memory_utilization: 0.67
    quantization: fp8
    kv_cache_dtype: fp8
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1                      # talker: speech codec token LM
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    gpu_memory_utilization: 0.15
    kv_cache_dtype: fp8              # KV only; weights stay bf16 on purpose
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    enforce_eager: false
    hf_overrides:                    # 4k sliding attention window, talker only.
      talker_config:                 # MUST be nested: a flat sliding_window key
        text_config:                 # lands on the Omni wrapper config and is
          sliding_window: 4096       # silently ignored (no error, no savings).
    devices: "0"
    input_connectors:
      from_stage_0: connector_coloc_speech
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2                      # code2wav: waveform reconstruction
    max_num_batched_tokens: 65536
    max_num_seqs: 128
    gpu_memory_utilization: 0.08
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_coloc_speech
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
