# Qwen3-Omni for the browser live session: ONE user, memory-conservative.
#
# A separate file from harness/deploy_pc_stage0.yaml on purpose. That config is
# what every number in workflow.md was measured with, so it must not be retuned
# -- changing it would silently invalidate the comparison it exists to support.
#
# Why this exists at all: deploy_pc_stage0.yaml (0.74 / 0.12 / 0.06 = 0.92) fits
# on vLLM 0.24.0 and does NOT fit on 0.26.0, which this branch needs. Stage 2 died
# with `Tried to allocate 1.41 GiB ... 1.04 GiB is free` after stage 1's CUDA graph
# capture had pushed resident memory to 85 GB. Two things changed under it:
# FlashInfer's CUTLASS fused-MoE kernels want workspace, and the card is shared --
# another user's MPS server holds a slice that the fractions do not know about.
#
# The headroom comes from THREE places, none of them stage 0's fraction:
#   * enforce_eager on stages 1 and 2 -- stage 1's CUDA graph capture is what took
#     resident memory to 85 GB and tipped the card over;
#   * max_num_seqs 16 -> 4, because this serves one person in a browser;
#   * max_num_batched_tokens 16384 -> 8192 on the thinker, which lowers the
#     activation peak.
#
# Stage 0's fraction was tried at 0.62 first and that was a mistake worth recording:
# its weights are 59.4 GiB, 0.62 x 94.97 = 58.9, so the stage came up with
# "Available KV cache memory: 0.0 GiB" and died. 0.74 is a floor.
#
# CODEC CHUNK SIZE, which is the vocoder's call batch and therefore the startup quantum.
#
# One codec frame = 1920 samples @ 24 kHz = 80 ms of audio, and the talker emits one per
# decode step at a measured 52.5 ms/frame (36 granules, R^2 0.99, gap = 0.656 x audio).
# So the talker is faster than real time per frame; what makes speech stall is waiting
# for a whole granule to accumulate before code2wav is called at all.
#
# At 25 frames a granule is 2.0 s of audio that takes 25 x 52.5 = 1.31 s to appear. The
# 0.217 s first granule cannot cover that, so playback either starts at 0.35 s and stalls
# ~1.1 s one word in, or waits until 1.7 s. Measured both ways with audio_timeline.py.
#
# At 4 frames a granule is 0.32 s of audio that takes 4 x 52.5 = 0.21 s to appear --
# delivery outruns playback from the very first boundary, so the early start is smooth.
#
# What it costs: every call re-processes codec_left_context_frames (25) frames of history
# for seam continuity WITHOUT emitting them, so the work per call is (25 + N) frames to
# produce N. At N=25 that is 2x; at N=4 it is 7.25x -- about 3.6x more vocoder compute per
# second of speech. That is invisible in latency, because stage 2 pipelines behind stage
# 1's next-frame decode (hence the ~0 intercept in the fit above), but it is real GPU work
# on a shared card, so it is paid in multi-user capacity rather than in milliseconds.
#
# initial_codec_chunk_frames is now redundant (same value) and kept so the ramp idea stays
# visible: small granules only while the buffer is empty would get the smooth early start
# without the steady-state compute. Not implemented -- the schedule is one value today.

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25

stages:
  - stage_id: 0                      # thinker: vision + audio encoders + LLM
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    # 0.74 is a FLOOR, not a preference: the thinker's weights are 59.4 GiB and
    # 0.62 x 94.97 = 58.9, which produced "Available KV cache memory: 0.0 GiB" and
    # killed the stage outright. The headroom stage 2 needs has to come from
    # somewhere else -- see enforce_eager below.
    gpu_memory_utilization: 0.74
    trust_remote_code: true
    # Stage 0 only. Stage 2 (code2wav) asserts with prefix caching on, and the
    # duplex sequence here is append-only, which is the case prefix caching is
    # for.
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1                      # talker: speech codec token LM
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    gpu_memory_utilization: 0.10
    trust_remote_code: true
    enable_prefix_caching: false
    # CUDA graph capture on this stage is what tipped the card over on 0.26.0.
    # Eager costs some per-step latency and buys the headroom stage 2 needs; if a
    # future run has the card entirely to itself, try turning this back off first.
    enforce_eager: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2                      # code2wav: waveform reconstruction
    max_num_batched_tokens: 65536
    max_num_seqs: 4
    gpu_memory_utilization: 0.08
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
