# deploy_mu_fp8_s128_async_sw4k.yaml with TWO changes, both on the memory
# ledger and neither touching compute:
#   1. stage-1 (talker) KV drops to FP8 (kv_cache_dtype: fp8, weights STAY
#      bf16 -- the community FP8-weights trap was the weights path, and the
#      talker feeds the vocoder). Per-token 20 KB -> 10 KB. Stacks with the
#      4k sliding window: SlidingWindowSpec carries kv_quant_mode.
#   2. the freed share moves to the thinker: stage-1 0.15 -> 0.10,
#      stage-0 0.67 -> 0.72. Total stays 0.90 (jkim's MPS shares the card).
#      Xiao asked for thinker 0.80; that does not fit: the talker process
#      carries ~7 GB of fixed overhead (weights + graphs), so every 0.01 of
#      share comes straight out of its pool -- at 0.08 the pool is ~0.6 GiB
#      (~16 users even with SWA+FP8), worse than before the sliding window.
#      0.72 is the thinker maximum with a functional talker inside 0.90.
#
# Expected boot receipts vs sw4k: stage-0 pool ~31 -> ~36 GiB (+16%);
# stage-1 pool ~7.5 -> ~2.4 GiB but at 10 KB/token that is ~246k physical
# tokens -- realistic capacity ~61 users at the 4k window, guaranteed floor
# ~12 concurrent maximal prefills. The binding ceiling stays the slot cap /
# speech-compute cliff, not the pool.
#
# QUALITY GATE: this stacks TWO quality variables on the talker (sliding
# window + FP8 KV). The bf16+SWA listening arm is saved under
# /data/zx/results/sw4k_verify_u1/wavs; this config's arm must be listened
# against it before either becomes a default.

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25
  connector_coloc_speech:
    name: ColocInProcConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25

stages:
  - stage_id: 0                      # thinker: vision + audio encoders + LLM
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    gpu_memory_utilization: 0.72
    quantization: fp8
    kv_cache_dtype: fp8
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1                      # talker: speech codec token LM
    max_num_batched_tokens: 8192
    max_num_seqs: 128
    gpu_memory_utilization: 0.10
    kv_cache_dtype: fp8              # KV only; weights stay bf16 on purpose
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    enforce_eager: false
    hf_overrides:                    # 4k sliding attention window, talker only.
      talker_config:                 # MUST be nested: a flat sliding_window key
        text_config:                 # lands on the Omni wrapper config and is
          sliding_window: 4096       # silently ignored (no error, no savings).
    devices: "0"
    input_connectors:
      from_stage_0: connector_coloc_speech
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2                      # code2wav: waveform reconstruction
    max_num_batched_tokens: 65536
    max_num_seqs: 128
    gpu_memory_utilization: 0.08
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_coloc_speech
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
