# Qwen3-Omni as MoshiRAG's retrieval back end ("the brain sidecar").
#
# Role: text-in/text-out OpenAI chat endpoint called by the MoshiRAG front
# end on <ret> triggers (and, later, the video-watching brain). Only 1-2
# concurrent requests, text-only responses - so this is deploy_mu_fp8 shrunk
# to coexist with the Moshi front end (~18 GB), its reference conditioner
# (~8 GB) and a local STT (~2 GB) on the shared 97.9 GB card.
#
# Deltas vs deploy_mu_fp8_s128_graph_t15.yaml:
#   stage0 fraction 0.67 -> 0.50 (fp8 weights 31.7 GiB + activations ~10 GiB
#     leave a small ~7 GiB KV pool - plenty for text-only retrieval turns),
#   max_num_batched_tokens 8192 -> 4096 (halves the profiling activation peak),
#   max_num_seqs 128 -> 8/4/4 (retrieval concurrency is 1-2),
#   stage1 0.15 -> 0.05, stage2 0.08 -> 0.04 (idle for text-only requests,
#     booted only because the pipeline is 3-stage).

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 4
      codec_left_context_frames: 25

stages:
  - stage_id: 0                      # thinker: the actual retrieval brain
    max_num_batched_tokens: 4096
    max_num_seqs: 8
    max_model_len: 16384
    gpu_memory_utilization: 0.36
    quantization: fp8
    kv_cache_dtype: fp8
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1                      # talker: idle for text-only retrieval
    max_num_batched_tokens: 4096
    max_num_seqs: 4
    gpu_memory_utilization: 0.09
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    enforce_eager: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2                      # code2wav: idle for text-only retrieval
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    max_model_len: 8192
    gpu_memory_utilization: 0.04
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 8192
      seed: 42
      repetition_penalty: 1.1
