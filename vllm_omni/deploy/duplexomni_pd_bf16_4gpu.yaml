# DuplexOmni P/D correctness baseline.
# GPU 0: Thinker prefill; GPU 1: Thinker decode; GPU 2: Talker/MTP;
# GPU 3: Code2Wav. The application still owns the finite 480 ms slot session.
pipeline: duplexomni_pd
async_chunk: false
dtype: bfloat16
trust_remote_code: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    hf_overrides:
      vllm_omni_duplexomni: true
    max_model_len: 49152
    max_num_batched_tokens: 32768
    max_num_seqs: 16
    async_scheduling: false
    gpu_memory_utilization: 0.9
    mm_processor_cache_gb: 8
    enable_prefix_caching: true
    devices: "0"
    env:
      VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
      VLLM_OMNI_STAGE0_SHM_MM_CACHE: "1"
    engine_extras:
      async_chunk: false
      kv_transfer_config:
        kv_connector: NixlDeltaPushConnector
        kv_connector_module_path: vllm_omni.engine.nixl_delta_push_connector
        kv_role: kv_producer
        kv_rank: 0
        kv_parallel_size: 2
        kv_load_failure_policy: fail
        kv_connector_extra_config:
          orchestrator_remote_host: 127.0.0.1
          orchestrator_remote_port: 5600
          enable_cross_layers_blocks: true
          kv_lease_duration: 300
    default_sampling_params:
      temperature: 0.0
      max_tokens: 999

  - stage_id: 1
    hf_overrides:
      vllm_omni_duplexomni: true
    max_model_len: 49152
    max_num_batched_tokens: 32768
    max_num_seqs: 16
    async_scheduling: false
    gpu_memory_utilization: 0.9
    enable_prefix_caching: true
    devices: "1"
    env:
      VLLM_NIXL_SIDE_CHANNEL_PORT: "5601"
    engine_extras:
      kv_transfer_config:
        kv_connector: NixlDeltaPushConnector
        kv_connector_module_path: vllm_omni.engine.nixl_delta_push_connector
        kv_role: kv_consumer
        kv_rank: 1
        kv_parallel_size: 2
        kv_load_failure_policy: fail
        kv_connector_extra_config:
          enable_cross_layers_blocks: true
          kv_lease_duration: 300
    default_sampling_params:
      temperature: 0.0
      max_tokens: 999

  - stage_id: 2
    max_model_len: 16384
    max_num_batched_tokens: 16384
    max_num_seqs: 32
    async_scheduling: false
    gpu_memory_utilization: 0.7
    enable_prefix_caching: true
    devices: "2"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_p: 0.8
      top_k: 20
      min_tokens: 6
      max_tokens: 7

  - stage_id: 3
    max_num_batched_tokens: 65536
    max_num_seqs: 32
    gpu_memory_utilization: 0.2
    enforce_eager: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "3"
    input_connectors:
      from_stage_2: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
